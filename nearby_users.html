<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light py-4">
    <div class="container" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold text-dark mb-0">Nearby Users</h4>
            <a href="/dashboard" class="btn btn-secondary btn-sm">Back to Chats</a>
        </div>

        <div class="wa-card p-3 shadow-sm">
            {% if users %}
                {% for u in users %}
                    <div class="d-flex align-items-center justify-content-between p-3 border-bottom">
                        <div class="d-flex align-items-center">
                            <img src="{{ url_for('static', filename='uploads/' + (u[3] if u[3] else 'default.png')) }}" 
                                 class="rounded-circle me-3" width="50" height="50" style="object-fit: cover;">
                            <div>
                                <h5 class="mb-0 fw-bold">{{ u[1] }}</h5>
                                <small class="text-muted">Code: <strong>{{ u[2] }}</strong> | Age: {{ u[4] if u[4] else 'N/A' }} | Gender: {{ u[5] if u[5] else 'N/A' }}</small>
                                <p class="mb-0 small text-secondary mt-1">{{ u[6] if u[6] else 'No bio' }}</p>
                            </div>
                        </div>
                        <form action="/send-request/{{ u[0] }}" method="POST">
                            <button type="submit" class="btn wa-btn-green btn-sm">Add Friend</button>
                        </form>
                    </div>
                {% endfor %}
            {% else %}
                <p class="text-center text-muted py-4 mb-0">No other users found nearby.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
