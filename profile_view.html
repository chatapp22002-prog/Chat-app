<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 380px;">
        <div class="text-center">
            <img src="{{ url_for('static', filename='uploads/' + (user[3] if user[3] else 'default.png')) }}" 
                 class="rounded-circle mb-3" width="100" height="100" style="object-fit: cover;">
            <h3>{{ user[1] }}</h3>
            <p class="text-muted">Code: {{ user[2] }}</p>
        </div>
        <hr>
        <div class="mb-3">
            <p><strong>Age:</strong> {{ user[4] if user[4] else 'Not specified' }}</p>
            <p><strong>Gender:</strong> {{ user[5] if user[5] else 'Not specified' }}</p>
            <p><strong>About:</strong> {{ user[6] if user[6] else 'No bio available' }}</p>
        </div>
        
        <form action="/send-request/{{ user[0] }}" method="POST">
            <button type="submit" class="btn btn-primary w-100 mb-2">Send Friend Request</button>
        </form>
        <a href="/dashboard" class="btn btn-secondary w-100">Back to Dashboard</a>
    </div>
</body>
</html>
